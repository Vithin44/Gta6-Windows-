name: Validate research artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report-schema:
    name: Validate JSON reports and manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install report validator
        run: python -m pip install -r tools/report/requirements.txt
      - name: Validate upstream manifest JSON
        run: python -m json.tool manifests/upstreams.json > /dev/null
      - name: Validate report schema and synthetic fixture
        run: python tools/report/validate_report.py examples/reports/synthetic-pass.json
      - name: Test upstream report normalizers
        run: python -m unittest discover -s tools/report -p "test_*.py" -v

  powershell-syntax:
    name: Parse Windows host probe
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Parse host scripts in Windows PowerShell 5.1
        shell: powershell
        run: |
          $paths = @(
            "tools/host_probe/Collect-HostInfo.ps1",
            "tools/host_probe/Summarize-HostInfo.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "Windows PowerShell 5.1 syntax errors in $path"
              foreach ($parseError in $parseErrors) {
                Write-Host ("Line " + $parseError.Extent.StartLineNumber + ", column " + $parseError.Extent.StartColumnNumber + ": " + $parseError.Message + " token=[" + $parseError.Extent.Text + "]")
              }
              throw "Windows PowerShell 5.1 could not parse $path."
            }
          }
          Write-Host "Both scripts parse in Windows PowerShell 5.1."
      - name: Parse PowerShell without running it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $paths = @(
            "tools/host_probe/Collect-HostInfo.ps1",
            "tools/host_probe/Summarize-HostInfo.ps1"
          )
          foreach ($relativePath in $paths) {
            $tokens = $null
            $parseErrors = $null
            $path = (Resolve-Path $relativePath).Path
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Error "PowerShell syntax errors in $relativePath"
              $parseErrors | Format-List
              exit 1
            }
          }
          Write-Host "Both PowerShell host-probe scripts parsed successfully."

  native-probe-compile:
    name: Compile CPU and D3D12 probe
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Build native capability probe
        shell: pwsh
        run: |
          cl /MT /nologo /std:c++17 /EHsc /W4 tools\host_probe\host_caps.cpp /link d3d12.lib dxgi.lib /OUT:tools\host_probe\host_caps.exe
          $dependencies = dumpbin /dependents tools\host_probe\host_caps.exe | Out-String
          if ($dependencies -match "VCRUNTIME|MSVCP") {
            throw "Probe unexpectedly depends on a dynamic MSVC runtime."
          }
      - name: Upload native probe executable
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-host-probe
          path: tools/host_probe/host_caps.exe
          if-no-files-found: error
          retention-days: 14
      - name: Assemble standalone host probe bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "host-probe-bundle"
          $probeDirectory = Join-Path $bundle "tools\host_probe"
          New-Item -ItemType Directory -Path $probeDirectory -Force | Out-Null
          Copy-Item tools\host_probe\host_caps.exe $probeDirectory
          Copy-Item tools\host_probe\Collect-HostInfo.ps1 $probeDirectory
          Copy-Item tools\host_probe\Summarize-HostInfo.ps1 $probeDirectory
          Copy-Item tools\host_probe\Run-HostProbe.bat $bundle
          $hash = (Get-FileHash tools\host_probe\host_caps.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $readme = Get-Content tools\host_probe\README.txt -Raw
          $readme = $readme.Replace("%GITHUB_SHA%", $env:GITHUB_SHA)
          $readme = $readme.Replace("%GITHUB_SERVER_URL%", $env:GITHUB_SERVER_URL)
          $readme = $readme.Replace("%GITHUB_REPOSITORY%", $env:GITHUB_REPOSITORY)
          $readme = $readme.Replace("%GITHUB_RUN_ID%", $env:GITHUB_RUN_ID)
          $readme = $readme.Replace("%HOST_CAPS_SHA256%", $hash)
          Set-Content -LiteralPath (Join-Path $bundle "README.txt") -Value $readme -Encoding utf8
          Write-Host "host_caps.exe SHA-256: $hash"
      - name: Upload standalone host probe bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-host-probe-bundle
          path: ${{ runner.temp }}/host-probe-bundle
          if-no-files-found: error
          retention-days: 14
      - name: Smoke test one-click host-probe bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "host-probe-bundle"
          Push-Location $bundle
          try {
            cmd /c .\Run-HostProbe.bat
            if ($LASTEXITCODE -ne 0) {
              throw "Run-HostProbe.bat failed with exit code $LASTEXITCODE."
            }
            if (-not (Test-Path ".\reports\host-probe.json")) {
              throw "One-click runner did not create reports\host-probe.json."
            }
            Write-Host "One-click host-probe bundle completed successfully."
          } finally {
            Pop-Location
          }
      - name: Execute native probe on the CI host
        shell: pwsh
        run: |
          $output = & tools\host_probe\host_caps.exe
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            throw "host_caps.exe exited with code $code"
          }
          $probe = ($output | Out-String) | ConvertFrom-Json
          if ($null -eq $probe.cpu -or $null -eq $probe.adapters) {
            throw "Native probe did not return the expected JSON structure."
          }
          Write-Host "Native probe executed and returned valid JSON."
      - name: Exercise readable summary with a synthetic host fixture
        shell: pwsh
        run: |
          ./tools/host_probe/Summarize-HostInfo.ps1 -InputPath examples/host-probe/synthetic.json
          $wave32Summary = (& ./tools/host_probe/Summarize-HostInfo.ps1 -InputPath examples/host-probe/synthetic-wave32.json *>&1 | Out-String)
          if ($wave32Summary -notmatch "64-lane waves") {
            throw "The host summary did not warn about a 32-lane-only GPU."
          }
      - name: Exercise read-only inventory end to end on CI host
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP "host-probe-ci.json"
          ./tools/host_probe/Collect-HostInfo.ps1 -IncludeD3D12Info -OutputPath $reportPath
          ./tools/host_probe/Summarize-HostInfo.ps1 -InputPath $reportPath
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.safety.gameFilesScanned -ne $false -or $report.safety.gameProcessesLaunched -ne $false) {
            throw "Host probe safety invariants were not preserved."
          }
          Write-Host "Read-only inventory and summary completed on the CI host."
